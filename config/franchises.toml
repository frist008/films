# Франшизы и вселенные владельца (R34). Ответы опроса 2026-10-23 (круг 1 — то, что владелец уже смотрел).
#
# Франшиза = ВСЯ вселенная: фильмы, спин-оффы, сериалы по фильмам и фильмы по сериалам, мультфильмы.
# Состав определяется по Wikidata («медиафраншиза» P8345 / «часть серии» P179), сверяется с Википедией (en/ru/uk)
# и fandom-вики; tmdb_collections — только отправная точка.
# scope: "all" — собирать за все годы; "2024-2026" — только наш диапазон; "none" — без приоритета;
#        from_year — нижняя граница для "all".
# review = ["tt…"] — члены, которые не поднимать (фан-фильмы, неофициальные документалки): confidence = review (films.franchise).
# confirm = ["tt…"] — канон, который автоматический флаг сомнения (parody / weak link …) зря отправил в review.
# При каждом «обнови базу» новые произведения этих вселенных подтягиваются и идут наверх таблицы.

